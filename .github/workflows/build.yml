name: Build
on: [ push, pull_request ]

jobs:
  build:
    name: Build (header only ${{ matrix.header_only }})
    runs-on: macos-latest

    strategy:
      matrix:
        header_only: [ NO, YES ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20 \
            -DRED4EXT_HEADER_ONLY=${{ matrix.header_only }} \
            -DRED4EXT_BUILD_EXAMPLES=ON \
            -DRED4EXT_EXTRA_WARNINGS=ON \
            -DRED4EXT_TREAT_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build -j

  addresses:
    name: Validate macOS address DB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Self-test
        run: python3 scripts/validate_addresses.py --self-test

      # No game binary in CI: segment/section/alignment/zero/duplicate/stats checks only.
      - name: Validate
        run: python3 scripts/validate_addresses.py --verified-only --quiet

      - name: Layout diff self-test
        run: python3 scripts/sdk_layout_diff.py --self-test
